# Bundle patch layer: mounts the qwen38 provider route on the profile root.
# The compaction backend row rides the qwen38 agent preset declared by
# presets/qwen38.patch.yml (the companion patch in this bundle's list),
# because the per-session agent preset owns the isolated compaction group.
- insert:
    - id: qwen38
      name: dsh-qwen38-local-qol
      config:
        baseURL: http://localhost:8080/v1
        model: Huihui-Qwen3.8-27B-abliterated-UD-Q5_K_XL
        displayName: Qwen3.8-27B
        dialect: llamacpp
        contextWindow: 229376
        maxTokens: 24576
        thinkingBudgets:
          low: 4096
          medium: 8192
          xhigh: 16384
        defaultEffort: medium
